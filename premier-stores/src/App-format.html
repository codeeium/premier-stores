<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal Radio Buttons</title>
  <style>
    .radio-buttons {
      display: flex; /* Align radio buttons horizontally */
      gap: 10px; /* Space between radio buttons */
    }
  </style>
</head>
<body>

  <div class="radio-buttons">
    <label>
      <input type="radio" name="nav" value="home"> Home
    </label>
    <label>
      <input type="radio" name="nav" value="about"> About
    </label>
    <label>
      <input type="radio" name="nav" value="contactus"> Contact Us
    </label>
  </div>

</body>
</html>
